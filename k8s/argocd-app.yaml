apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-cd-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: YOUR_DOCKERHUB_USERNAME/gitops-demo-app
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-repo-url: https://github.com/your-org/your-repo.git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-repo
    path: gitops-demo/chart
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
