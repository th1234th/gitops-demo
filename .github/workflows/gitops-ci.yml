name: GitOps CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build -t "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${IMAGE_TAG}" .
          docker tag "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${IMAGE_TAG}" "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:latest"

      - name: Push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:latest"

      - name: Update Helm chart image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          python - "$IMAGE_TAG" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path('chart/values.yaml')
          text = path.read_text()
          lines = text.splitlines()
          new_lines = []
          inside_image = False
          repo_index = None
          repo_indent = ''
          tag_found = False
          for line in lines:
              stripped = line.strip()
              if stripped == 'image:' and not line.startswith(' '):
                  inside_image = True
                  new_lines.append(line)
                  continue
              if inside_image and stripped and not line.startswith(' '):
                  inside_image = False
              if inside_image:
                  if re.match(r'^\s*tag:\s*.*$', line):
                      indent = re.match(r'^(\s*)', line).group(1)
                      new_lines.append(f'{indent}tag: {sys.argv[1]}')
                      tag_found = True
                      continue
                  if re.match(r'^\s*repository:\s*.*$', line):
                      repo_index = len(new_lines)
                      repo_indent = re.match(r'^(\s*)', line).group(1)
                      new_lines.append(line)
                      continue
                  if re.match(r'^\s*[0-9a-f]{7,40}\s*$', line):
                      continue
              new_lines.append(line)
          if not tag_found:
              if repo_index is None:
                  raise SystemExit('Unable to find image repository line in values.yaml')
              new_lines.insert(repo_index + 1, f'{repo_indent}tag: {sys.argv[1]}')
          newline = '\n' if text.endswith('\n') else ''
          path.write_text('\n'.join(new_lines) + newline)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: bump chart image tag to ${IMAGE_TAG}"
            git push origin HEAD:main
          else
            echo "No chart changes to commit"
          fi

      - name: Display deployment manifest path
        run: |
          echo "Deployment manifest path is chart"
