name: GitOps CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build -t "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${IMAGE_TAG}" gitops-demo
          docker tag "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${IMAGE_TAG}" "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:latest"

      - name: Push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKER_USERNAME }}/gitops-demo-app:latest"

      - name: Update Helm chart image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          python - "$IMAGE_TAG" <<'PY'
          import sys, pathlib
          path = pathlib.Path('gitops-demo/chart/values.yaml')
          text = path.read_text()
          old = 'tag: latest'
          new = f'tag: {sys.argv[1]}'
          if old not in text:
              raise SystemExit('Unable to find image tag placeholder in values.yaml')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops-demo/chart/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: bump chart image tag to ${IMAGE_TAG}"
            git push origin HEAD:main
          else
            echo "No chart changes to commit"
          fi

      - name: Display deployment manifest path
        run: |
          echo "Deployment manifest path is gitops-demo/chart"
